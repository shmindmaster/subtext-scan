name: Release

# Pushing a v* tag runs the tests, then publishes to npm through npm trusted publishing
# (GitHub Actions OIDC, no stored token) with a provenance attestation.

on:
  push:
    tags: ['v*']

permissions:
  id-token: write
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  npm:
    name: Test and publish subtext-scan to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: npm 11.5.1 or later (required for trusted publishing)
        run: npm install -g npm@11 && npm --version
      - name: Tag matches the package version
        run: test "${GITHUB_REF_NAME}" = "v$(node -p 'require("./package.json").version')"
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run smoke:package
      - name: Publish with provenance (npm trusted publishing, no stored token)
        run: npm publish --access public --provenance
