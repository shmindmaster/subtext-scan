name: subtext-scan

services:
  test:
    image: subtext-scan:local
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
    command: ["npm", "test"]
    volumes:
      - ./src:/app/src:ro
      - ./bin:/app/bin:ro
      - ./tests:/app/tests:ro
      - ./fixtures:/app/fixtures:ro
      - ./scripts:/app/scripts:ro

  typecheck:
    image: subtext-scan:local
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
    command: ["npm", "run", "typecheck"]
    volumes:
      - ./src:/app/src:ro
      - ./tests:/app/tests:ro

  fixtures:
    image: subtext-scan:local
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
    command: ["npm", "run", "fixtures"]
    volumes:
      - ./src:/app/src:ro
      - ./bin:/app/bin:ro
      - ./scripts:/app/scripts:ro
      - ./fixtures:/app/fixtures
